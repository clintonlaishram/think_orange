    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) — GA4 property G-ZRG07MX0NC.
         Deliberately OUTSIDE the SEO:START/SEO:END markers below:
         scripts/prerender.mjs replaces everything between those two comments
         wholesale for every route, so anything placed inside them is
         overwritten in the built output. Google's own instruction is one tag
         per page, immediately inside <head> — do not add a second copy. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZRG07MX0NC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZRG07MX0NC");
    </script>
    <!-- Phase 9 (BUILD-PLAN.md): everything between the two markers below is
         the fallback for `npm run dev` AND the exact block
         scripts/prerender.mjs replaces wholesale for each of the 49 routes
         (see buildHeadBlock() there, which mirrors src/lib/seo.js's
         resolveSeo() output) — a single string-replace between two HTML
         comments, deliberately not per-tag regex, so a future tag added here
         doesn't need a matching regex added there. Values below are the
         homepage's own, kept real (not "TODO") so a dev-mode load or an
         unprerendered fallback never ships a placeholder tag. -->
    <!-- SEO:START -->
    <title>ThinkOrange Consulting | GST, Income Tax & Compliance Advisory — Salem</title>
    <meta
      name="description"
      content="ThinkOrange Consulting Private Limited — GST, income tax, business setup, accounting & audit, government tenders, and Digital Signature Certificates. Salem, Tamil Nadu, serving clients pan-India."
